version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # These are all "best effort" calls where a failure has nothing meaningful
      # to act on — a client that already disconnected, a cleanup Close() on a
      # path that's already erroring, or a write to an in-memory buffer that
      # cannot fail. Genuine failure paths (see internal/informers/informers.go's
      # AddEventHandler, internal/handlers/prometheus.go's SetManualURL) are
      # checked and logged explicitly instead of being listed here.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*io.PipeReader).Close
        - (*io.PipeWriter).Close
        - (net/http.ResponseWriter).Write
        - (*net/http.Response).Body.Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/gorilla/websocket.Conn).WriteMessage
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*encoding/json.Encoder).Encode
